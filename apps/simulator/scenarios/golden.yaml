# REGISTA golden match: Harrowmere FC v Kestrel Bay Athletic, Matchweek 9, Ashgrove Park.
# Implements every beat of docs/DATA_AND_METRICS.md §3. Coordinates are team-relative to the
# beat's team (it attacks towards x = 105, its left touchline is y = 0). Times are match clocks;
# a beat's `at` is when its key action (the shot) should happen, `minute` the minute it must show.
# The chaos targets are met through the regimes (checked with the §8 index against the committed
# calibration baselines). Model-dependent targets of Phase 2 (win probability, PPDA values) are
# tuned by moving this geometry, never by changing the metric formulas.
schema: regista.scenario.v1
name: golden
description: >-
  Harrowmere control the first 20 minutes and score through #11; Sorvali sets the season's speed
  record on a counter; Kestrel Bay's double substitution and press equalise after a high turnover
  (first credited to Vennholm, re-credited to Belkora); Quell's through ball sends Valdane clear
  for his 50th career goal; Kestrel Bay besiege the box late on. Harrowmere win 2-1.

match:
  match_id: m001
  home: HMR
  away: KBA
  matchweek: 9
  kickoff: "2026-10-24T16:30:00Z"
  referee: REF-03
  weather: {condition: clear, temperature_c: 11, wind_kmh: 9}
  added_time_min: [2, 4]
  half_time_break_s: 900
  home_attacks_right_first: true

guards:
  unscripted_goals: false
  unscripted_red_cards: false
  protected_players: [HMR-7, HMR-8, HMR-9, HMR-10, HMR-11, KBA-7, KBA-11]
  max_unscripted_speed_kmh: 33.8          # Sorvali's 34.6 stays the match's (and season's) best
  no_unscripted_shots:
    - {player: HMR-9, until: "67:00"}     # Valdane's 4 shots by 67' are the scripted ones

regimes:
  # completion < 1: a nervy spell (some would-be completions fail); > 1: a steady spell (some
  # would-be failures still arrive). Dials override the club's tactics, with a linear ramp.
  # 0-20': Harrowmere keep the ball in long, patient spells; Kestrel Bay sit deep, rushed on the ball
  - {team: HMR, from: "00:00", to: "21:00", ramp_s: 30, completion: 1.9, set: {tempo: 0.25, directness: 0.05, pressing_intensity: 0.6, defensive_line: 0.55}}
  - {team: KBA, from: "00:00", to: "21:00", ramp_s: 30, completion: 0.75, set: {pressing_intensity: 0.1, defensive_line: 0.15, directness: 0.6, tempo: 0.9}}
  # 45'-54': the same control to start the second half (chaos ~41)
  - {team: HMR, from: "45:00", to: "54:00", ramp_s: 35, completion: 1.9, set: {tempo: 0.25, directness: 0.05, pressing_intensity: 0.56, defensive_line: 0.55}}
  - {team: KBA, from: "45:00", to: "54:00", ramp_s: 35, completion: 0.72, set: {pressing_intensity: 0.1, defensive_line: 0.15, directness: 0.49, tempo: 0.9}}
  # from 54': Kestrel Bay press high after the double substitution (shift detected ~58'); Harrowmere
  # get nervy on the ball and press back (chaos ~72)
  - {team: KBA, from: "54:00", to: "75:00", ramp_s: 90, set: {pressing_intensity: 0.95, defensive_line: 0.9, tempo: 0.8}}
  - {team: HMR, from: "55:00", to: "75:00", ramp_s: 60, completion: 0.8, set: {pressing_intensity: 0.87}}
  # 79'-FT: Kestrel Bay siege; Harrowmere defend deep, contest every ball and clear it in a hurry
  - {team: KBA, from: "79:00", to: "95:00", ramp_s: 70, completion: 0.75, set: {pressing_intensity: 0.95, defensive_line: 0.85, tempo: 0.9, directness: 0.75}}
  - {team: HMR, from: "79:00", to: "95:00", ramp_s: 70, completion: 0.6, set: {defensive_line: 0.1, pressing_intensity: 0.95, directness: 1.0, tempo: 0.6}}

