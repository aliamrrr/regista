[project]
name = "regista-core"
version = "0.1.0"
description = "REGISTA core service: Scout, Analyst, Spotter, agents, Director, API and match MCP server."
license = "MIT"
authors = [{ name = "aliamrrr" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
regista-core = "regista_core.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "regista_core"
module-root = ""
