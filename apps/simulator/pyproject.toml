[project]
name = "regista-sim"
version = "0.1.0"
description = "Synthetic football league, 10 Hz match engine and golden-match scenario for REGISTA."
license = "MIT"
authors = [{ name = "aliamrrr" }]
requires-python = ">=3.12,<3.13"
# Pure Python by design: no Azure SDKs, ever (see docs/ARCHITECTURE.md §2).
# matplotlib (calibration histograms) lives in the root dev group, so runtime images stay lean.
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
regista-sim = "regista_sim.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "regista_sim"
module-root = ""
